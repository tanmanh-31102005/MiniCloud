server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Add custom header indicating the backend web server hostname
    add_header X-Served-By $hostname always;

    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Blog alias routing
    location ^~ /blog/ {
        alias /usr/share/nginx/html/blog/;
        index index.html;
        try_files $uri $uri/ /blog/index.html =404;
    }

    # Healthcheck endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Prometheus metrics endpoint for Web Server (Chức năng mở rộng 7)
    location /metrics {
        access_log off;
        default_type text/plain;
        return 200 "# HELP nginx_up State of Nginx web server\n# TYPE nginx_up gauge\nnginx_up 1\n# HELP nginx_http_requests_total Total requests\n# TYPE nginx_http_requests_total counter\nnginx_http_requests_total 10\n";
    }

    # Server identification API for frontend UI badge & testing
    location /server-info {
        default_type application/json;
        return 200 '{"server":"$hostname","status":"online"}';
    }
}
